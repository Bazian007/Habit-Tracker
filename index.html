<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Habit Tracker</h1>
      <p class="subtitle">Build healthy habits, one day at a time.</p>
      <p class="quote">“Don’t count the days. Make the days count.” Muhammad Ali</p>
      <button type="button" id="theme-toggle">Dark mode</button>
    </header>
    <div id="stats" class="stats"></div>
    <div class="dashboard">
      <section id="calendar" class="calendar">
        <!-- Filled by app.js -->
      </section>
    
      <section class="activity-breakdown">
        <h2>Activity breakdown</h2>
        <div id="activity-breakdown"></div>
      </section>
    </div>

    <section class="recent-activity">
      <h2>Recent activity</h2>
      <div id="recent-activity"></div>
    </section>

      <div id="modal" class="modal hidden" aria-hidden="true">
        <div class="modal-backdrop" id="modal-backdrop"></div>
        <div class="modal-panel" role="dialog" aria-labelledby="modal-title">
          <h3 id="modal-title">Log activities</h3>
          <p id="modal-date" class="modal-date"></p>
          <div id="activity-options" class="activity-options"></div>
          <button type="button" id="clear-workout" class="clear-btn hidden">Remove activities</button>
          <button type="button" id="close-modal" class="close-btn">Cancel</button>
        </div>
      </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
